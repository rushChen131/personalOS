# PersonalOS — full stack (PostgreSQL + pgvector, Redis, MinIO, backend, worker, frontend)
#
# Local-only quick start (no Docker, SQLite) is documented in README.md.
# This compose file is the production-shaped path: containers talk to each
# other by service name, never via localhost.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: personalos
      POSTGRES_PASSWORD: personalos
      POSTGRES_DB: personalos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personalos -d personalos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-personalos}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-personalos123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://personalos:personalos@postgres:5432/personalos
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-personalos}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-personalos123}
      S3_BUCKET: ${S3_BUCKET:-personalos}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-personalos-dev-secret-change-me}
      FRONTEND_ORIGIN: http://localhost:3000
      SEED_DEMO_USER: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.jobs.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://personalos:personalos@postgres:5432/personalos
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-personalos}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-personalos123}
      S3_BUCKET: ${S3_BUCKET:-personalos}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-personalos-dev-secret-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Baked in at build time; the browser must reach the backend directly
        # or through the Next rewrite.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
